# Rubric for the p001-only happy-path fixture.
#
# This fixture's recorded response is well-formed JSON that cites real
# finding IDs at correct dollar values. Every assertion below should
# pass on a clean run.

- type: structural_valid_json

- type: status
  equals: ok

- type: parse_retry_count
  equals: 0

- type: dropped_steps_count
  equals: 0

- type: steps_count
  min: 1

- type: total_impact_within_input_sum

- type: order_rank_unique

# Highest-impact finding is the only terraform-managed one (vol-aaaa, $80).
# The plan must include it.
- type: includes_finding
  finding_id_evidence:
    terraform_managed: true

# vol-bbbb is the only volume without a snapshot in this fixture; it is
# also the only one with safe_to_fix=false (no snapshot → not safe to
# delete). The planner must never suggest api_call for it. (Validators
# would drop it; this assertion is the second line of defense.)
#
# Filter uses `has_snapshot: false` because `safe_to_fix` is a top-level
# Finding field, not an evidence key — the rubric's shallow matcher only
# inspects evidence. The original assertion filtered on `safe_to_fix`
# and silently passed vacuously until the vacuous-pass fix surfaced it.
- type: never_recommends_mode
  mode: api_call
  for_finding_evidence:
    has_snapshot: false
